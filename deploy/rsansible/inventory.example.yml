# Copy to inventory/production.yml (Wheat-ignored) and fill in. Secrets go
# in inventory/group_vars/all/secrets.yml, also ignored:
#
#   sorry_portainer_admin_password: "at least 12 characters"
all:
  vars:
    ansible_user: root
    # The master's control URL, as agents reach it. Its host name must be
    # one of sorry_portainer_server_names.
    sorry_portainer_master: master
    sorry_portainer_control_url: "wss://master.example.com:9443/control/agent"
  children:
    sorry_portainer_server:
      hosts:
        master:
          ansible_host: master.example.com
          sorry_portainer_server_names: [master.example.com]
          # docker: Caddy is a Docker container on this network; the
          # dashboard listens on its gateway address. loopback: Caddy is a
          # sorry-portainer stack on this host, and the dashboard listens
          # on 127.0.0.1 (set sorry_portainer_agent_host_loopback for this
          # host's agent, and route sorry_portainer_dashboard_host from the
          # Caddy stack to that address).
          sorry_portainer_dashboard_route: docker
          sorry_portainer_caddy_network: caddy
          sorry_portainer_dashboard_host: sorry-portainer.example.com
    sorry_portainer_agents:
      hosts:
        podman-host:
          ansible_host: podman-host.example.com
          # Defaults to the inventory name.
          sorry_portainer_host_id: podman-host
          # Where this host's agent containers reach its 127.0.0.1, e.g. for
          # a Caddy stack in front of a master on the same host. Every agent
          # container can then reach the host's loopback services.
          # sorry_portainer_agent_host_loopback: 169.254.1.3
          # Lets a Caddy stack bind 80 and 443 (affects every account).
          # sorry_portainer_agent_unprivileged_port_start: 80
