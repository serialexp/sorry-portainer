# Podman 6 from serialexp/podman-ubuntu, pinned by version, URL and
# SHA-256 in vars/podman.yml, until Gothab serves it from an apt
# repository. setup then finds a complete Podman and installs nothing.

- name: Check the Ubuntu release
  assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in sorry_portainer_ubuntu_versions
    fail_msg: "agent hosts run Ubuntu, a release named in sorry_portainer_ubuntu_versions"
  tags: [sorry-portainer, podman]

- name: Pick this release's Podman packages
  set_fact:
    sorry_portainer_podman_dir: "/var/cache/podman-ubuntu/{{ podman_ubuntu_release }}"
    sorry_portainer_podman_ubuntu: "{{ sorry_portainer_ubuntu_versions[ansible_distribution_release] }}"
  tags: [sorry-portainer, podman]

- name: Create the Podman package directory
  file:
    path: "{{ sorry_portainer_podman_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [sorry-portainer, podman]

- name: Download the Podman packages
  get_url:
    url: "{{ item.url }}"
    dest: "{{ sorry_portainer_podman_dir }}/{{ item.file }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ podman_ubuntu_packages[sorry_portainer_podman_ubuntu] }}"
  tags: [sorry-portainer, podman]

# dpkg-query lists by package name, as the pins are sorted.
- name: Check the installed Podman packages
  command:
    cmd: "dpkg-query --show '--showformat=${db:Status-Abbrev}${Package}=${Version}\\n' {{ podman_ubuntu_packages[sorry_portainer_podman_ubuntu] | map(attribute='name') | join(' ') }}"
  register: sorry_portainer_podman_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [sorry-portainer, podman]

- name: Expect the pinned versions
  set_fact:
    sorry_portainer_podman_wanted: "{% for p in podman_ubuntu_packages[sorry_portainer_podman_ubuntu] | sort(attribute='name') %}ii {{ p.name }}={{ p.version }}\n{% endfor %}"
  tags: [sorry-portainer, podman]

# Conffiles the host changed are kept; ours change nothing Ubuntu's ship.
- name: Install the Podman packages
  command:
    cmd: "apt-get install --yes --option Dpkg::Options::=--force-confdef --option Dpkg::Options::=--force-confold {% for p in podman_ubuntu_packages[sorry_portainer_podman_ubuntu] %} {{ sorry_portainer_podman_dir }}/{{ p.file }}{% endfor %}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: sorry_portainer_podman_installed.stdout | trim != sorry_portainer_podman_wanted | trim
  notify: Restart sorry-portainer-agent
  tags: [sorry-portainer, podman]
