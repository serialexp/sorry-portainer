# An agent host: Podman 6 from the pinned packages, then
# `sorry-portainer-agent setup` adds the rootless service user
# (sorry-portainer-agent; rsansible does not template become_user), its
# Podman configuration, the binary and its unit; the host then enrolls with
# a one-time token from the master and the service starts.

- import_tasks: rename.yml

- import_tasks: podman.yml

- name: Create the download directory
  file:
    path: "{{ sorry_portainer_agent_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [sorry-portainer]

- name: Download the agent binary
  get_url:
    url: "{{ sorry_portainer_agent_binary_url }}"
    dest: "{{ sorry_portainer_agent_download_dir }}/sorry-portainer-agent"
    checksum: "sha256:{{ sorry_portainer_agent_binary_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  tags: [sorry-portainer]

- name: Check the installed agent binary
  stat:
    path: "{{ sorry_portainer_agent_bin }}"
  register: sorry_portainer_agent_installed
  tags: [sorry-portainer]

# In check mode a new host has no downloaded binary to ask; setup then
# counts as pending.
- name: Check the downloaded agent binary
  stat:
    path: "{{ sorry_portainer_agent_download_dir }}/sorry-portainer-agent"
  register: sorry_portainer_agent_downloaded
  tags: [sorry-portainer]

- name: Check what setup would change
  command:
    argv:
      - "{{ sorry_portainer_agent_download_dir }}/sorry-portainer-agent"
      - setup
      - --dry-run
      - --user
      - sorry-portainer-agent
      - "--map-host-loopback={{ sorry_portainer_agent_host_loopback }}"
  register: sorry_portainer_agent_plan
  changed_when: false
  check_mode: false
  when: sorry_portainer_agent_downloaded.stat.exists
  tags: [sorry-portainer]

- name: Check whether the agent is enrolled
  stat:
    path: "{{ sorry_portainer_agent_dir }}/agent.json"
  register: sorry_portainer_agent_config
  tags: [sorry-portainer]

# setup is idempotent; it runs when the host lacks something, the user's
# Podman configuration differs, the installed binary is not the pinned
# one, or (check mode on a new host) there was nothing to ask.
- name: Set up the agent host
  command:
    argv:
      - "{{ sorry_portainer_agent_download_dir }}/sorry-portainer-agent"
      - setup
      - --user
      - sorry-portainer-agent
      - "--map-host-loopback={{ sorry_portainer_agent_host_loopback }}"
    chdir: /
  when: >-
    sorry_portainer_agent_plan is skipped
    or 'No package or rootless Podman changes are required.' not in sorry_portainer_agent_plan.stdout
    or not sorry_portainer_agent_installed.stat.exists
    or sorry_portainer_agent_installed.stat.checksum != sorry_portainer_agent_binary_sha256
  notify: Restart sorry-portainer-agent
  tags: [sorry-portainer]

- import_tasks: enroll.yml

- name: Start the agent
  systemd:
    name: sorry-portainer-agent
    enabled: true
    state: started
    daemon_reload: true
  tags: [sorry-portainer]
